<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Defense in depth: only this site's own scripts, styles and data may load. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>devlog</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>devlog <span class="subtitle">GitHub 開発記録</span></h1>
      <div role="tablist" aria-label="表示切り替え" class="tabs" id="tabs">
        <button role="tab" id="tab-recent" aria-controls="panel" data-tab="recent">最近の記録</button>
        <button role="tab" id="tab-daily" aria-controls="panel" data-tab="daily">今日・昨日</button>
        <button role="tab" id="tab-repos" aria-controls="panel" data-tab="repos">リポジトリ一覧</button>
        <button role="tab" id="tab-notes" aria-controls="panel" data-tab="notes">ノート</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="panel" role="tabpanel" aria-live="polite">
    <p class="state">読み込み中…</p>
  </main>
  <footer class="wrap site-footer" id="footer"></footer>
  <noscript><p class="wrap state">この画面の表示には JavaScript が必要です。</p></noscript>
  <script src="devlog-lib.js"></script>
  <script src="markdown-lib.js"></script>
  <script src="app.js"></script>
</body>
</html>

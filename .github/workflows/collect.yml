name: Collect devlog

on:
  schedule:
    # 21:00 UTC = 06:00 JST, daily
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "取得対象日数(何日前まで遡るか)。空欄なら7日(通常運用時の既定値)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: devlog-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devlog
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect merged PRs / releases / direct commits
        env:
          DEVLOG_READ_TOKEN: ${{ secrets.DEVLOG_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVLOG_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: python3 scripts/collect.py

      - name: Commit and push if logs changed
        run: |
          git config user.name "devlog-bot"
          git config user.email "devlog-bot@users.noreply.github.com"

          git add logs

          if git diff --cached --quiet; then
            echo "No changes in logs/, skipping commit."
            exit 0
          fi

          # scripts/collect.py skips this exact commit when collecting devlog
          # itself (SELF_AUTO_COMMIT_SUBJECT); keep the two in sync.
          git commit -m "chore(logs): update devlog entries"
          git push
